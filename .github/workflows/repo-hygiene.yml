name: Repo hygiene

on:
  schedule:
    # Mondays 03:17 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'logs/**'
      - 'status/**'
      - 'docs/**'
      - 'handbooks/**'
      - 'plan/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  rotate-logs:
    name: Weekly log rotation
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Prune old logs
        run: scripts/weekly-cleanup.sh

      - name: Commit the rotation
        run: |
          git config user.name "droidroute-bot"
          git config user.email "240211895+mertgoevse-wq@users.noreply.github.com"
          git add -A logs/
          if git diff --cached --quiet; then
            echo "nothing to rotate"
          else
            git commit -m "chore(logs): weekly rotation"
            git push
          fi

  integrity:
    name: Secrets, links and plan integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets preflight
        run: bash scripts/preflight-secrets.sh

      - name: Check relative markdown links
        run: |
          python3 - <<'PY'
          import os, re, sys, urllib.parse
          root = os.getcwd()
          bad = []
          pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for dirpath, dirnames, filenames in os.walk('.'):
              dirnames[:] = [d for d in dirnames if d not in ('.git', 'build', 'logs', 'node_modules')]
              for name in filenames:
                  if not name.endswith('.md'):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, encoding='utf-8') as fh:
                      text = fh.read()
                  for target in pattern.findall(text):
                      if target.startswith(('http://', 'https://', 'mailto:', '#')):
                          continue
                      clean = urllib.parse.unquote(target.split('#')[0].strip())
                      if not clean:
                          continue
                      resolved = os.path.normpath(os.path.join(dirpath, clean))
                      if not os.path.exists(resolved):
                          bad.append(f"{path} -> {target}")
          if bad:
              print("Broken relative links:")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print("all relative links resolve")
          PY

      - name: Plan integrity
        run: |
          count=$(find plan -name 'T-*.md' | wc -l)
          echo "task files: $count"
          if [ "$count" -lt 135 ]; then
            echo "::error::expected at least 135 task files, found $count"
            exit 1
          fi
          # every task file must carry the required sections
          missing=0
          for f in $(find plan -name 'T-*.md'); do
            for section in '## Goal' '## Skills' '## Steps' '## Acceptance criteria' '## Verification'; do
              if ! grep -qF "$section" "$f"; then
                echo "::error file=$f::missing section $section"
                missing=1
              fi
            done
          done
          exit $missing
