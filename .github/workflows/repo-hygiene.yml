name: Repo hygiene

on:
  schedule:
    # Mondays 03:17 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'logs/**'
      - 'status/**'
      - 'docs/**'
      - 'handbooks/**'
      - 'plan/**'
      - 'scripts/**'
      - 'tools/**'
      - 'design/**'

permissions:
  contents: write

jobs:
  rotate-logs:
    name: Weekly log rotation
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Prune old logs
        run: scripts/weekly-cleanup.sh

      - name: Commit the rotation
        run: |
          git config user.name "droidroute-bot"
          git config user.email "240211895+mertgoevse-wq@users.noreply.github.com"
          git add -A logs/
          if git diff --cached --quiet; then
            echo "nothing to rotate"
          else
            git commit -m "chore(logs): weekly rotation"
            git push
          fi

  integrity:
    name: Secrets, design, consistency and plan integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets preflight
        run: bash scripts/preflight-secrets.sh

      - name: Tooling inventory is current
        run: python3 scripts/discover_tooling.py --check

      - name: Design gate bites (self-test) and passes (sources and drawings)
        run: |
          python3 tools/check_design_slop.py --self-test
          python3 tools/check_design_slop.py

      - name: Plan consistency (links, plan freshness, skill labels, ids, counts, code word)
        run: python3 tools/check_plan_consistency.py

      - name: Plan integrity
        run: |
          # A floor, not a target: it catches a plan that was truncated or a generator
          # that silently dropped a phase. Raise it as the plan grows.
          count=$(find plan -name 'T-*.md' | wc -l)
          echo "task files: $count"
          if [ "$count" -lt 205 ]; then
            echo "::error::expected at least 205 task files, found $count"
            exit 1
          fi
          # every task file must carry the required sections
          missing=0
          for f in $(find plan -name 'T-*.md'); do
            for section in '## Goal' '## Read first' '## Skills' '## Deliverables' '## Steps' '## Acceptance criteria' '## Verification' '## Definition of done' '## Rules that always apply' '## Logging & Git' '## State after success' '## Stop conditions' '## Handover'; do
              if ! grep -qF "$section" "$f"; then
                echo "::error file=$f::missing section $section"
                missing=1
              fi
            done
          done
          exit $missing
