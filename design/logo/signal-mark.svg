<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="680" height="520"
     role="img" aria-label="DroidRoute mark Signal: an open ring with a path line through it and a copper point inside">
  <title>DroidRoute mark — Signal</title>
  <desc>Geometry: ring centre (12,12) r=7, stroke 2 · path line y=12 from x=2 to x=22, stroke 2 · point r=2.6 at (17,12) on a 24x24 grid. Three variants plus a size proof at 24, 32 and 48 dp.</desc>

  <!-- variant 1: on graphite (the primary) -->
  <rect x="0" y="0" width="170" height="150" fill="#0E1217"/>
  <g transform="translate(49,27) scale(3)" fill="none">
    <circle cx="12" cy="12" r="7" stroke="#DE8F57" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.6" fill="#DE8F57" stroke="none"/>
  </g>
  <text x="85" y="126" fill="#898E94" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">on graphite</text>

  <!-- variant 2: on paper -->
  <rect x="170" y="0" width="170" height="150" fill="#F5F7F9"/>
  <g transform="translate(219,27) scale(3)" fill="none">
    <circle cx="12" cy="12" r="7" stroke="#AC5500" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#161B20" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.6" fill="#AC5500" stroke="none"/>
  </g>
  <text x="255" y="126" fill="#65696F" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">on paper</text>

  <!-- variant 3: monochrome (launcher, tinted) -->
  <rect x="0" y="150" width="170" height="110" fill="#151A1F"/>
  <g transform="translate(49,168) scale(3)" fill="none" stroke="#E5E8EB">
    <circle cx="12" cy="12" r="7" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.6" fill="#E5E8EB" stroke="none"/>
  </g>
  <text x="85" y="248" fill="#898E94" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">monochrome · one colour</text>

  <!-- size proof: 48 / 32 / 24 -->
  <rect x="170" y="150" width="170" height="110" fill="#1C2126"/>
  <g transform="translate(196,206) scale(2)" fill="none">
    <circle cx="12" cy="12" r="7" stroke="#DE8F57" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.6" fill="#DE8F57" stroke="none"/>
  </g>
  <g transform="translate(250,214) scale(1.333)" fill="none">
    <circle cx="12" cy="12" r="7" stroke="#DE8F57" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.6" fill="#DE8F57" stroke="none"/>
  </g>
  <g transform="translate(298,222) scale(1)" fill="none">
    <circle cx="12" cy="12" r="7" stroke="#DE8F57" stroke-width="2"/>
    <line x1="2" y1="12" x2="22" y2="12" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="17" cy="12" r="2.6" fill="#DE8F57" stroke="none"/>
  </g>
  <text x="255" y="248" fill="#898E94" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">48 · 32 · 24 dp</text>
</svg>
