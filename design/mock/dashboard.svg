  <text x="40" y="30" fill="#E5E8EB" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="600">Dashboard — layout intent</text>
  <text x="40" y="48" fill="#898E94" font-family="ui-monospace, monospace" font-size="10">not a screenshot · screenshots are produced by the harness (T-197) · colours from docs/14 §5, sizes §6/§7, motion §15.3</text>

