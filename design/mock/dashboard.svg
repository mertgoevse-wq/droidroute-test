<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 930" width="880" height="930"
     role="img" aria-label="The DroidRoute Dashboard drawn in both modes, annotated with the tokens it uses">
  <title>DroidRoute Dashboard — layout intent, dark and light</title>
  <desc>Two phone-width panels showing the same state so the tokens can be compared. The focal element is the Signalweg: client, the DroidRoute switch and two provider lines, with a copper point in flight and the failed hop naming its reason. Below the Signalweg sits one hero number and a demoted list of recent requests. This is layout intent drawn from docs/14-design-system.md, not a screenshot.</desc>

