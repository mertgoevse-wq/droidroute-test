  <!-- ============================= caption ============================= -->
  <line x1="40" y1="812" x2="840" y2="812" stroke="#22272C"/>
  <text x="40" y="836" fill="#E5E8EB" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="600">What to look at, and where in the system it is decided</text>

  <g font-family="ui-monospace, monospace" font-size="11">
    <text x="40" y="862" fill="#B4B8BC">1  Fokus zuerst: der Signalweg, dann die Zahl. Vier gleich große Karten wären der Fehler.</text>
    <text x="40" y="882" fill="#B4B8BC">2  Der laufende Punkt ist Kupfer (#DE8F57) — eine Aussage über den Weg, kein Status.</text>
    <text x="40" y="902" fill="#B4B8BC">3  Der fehlgeschlagene Sprung nennt seinen Grund, rot statt grau zu werden.</text>
    <text x="470" y="862" fill="#B4B8BC">4  Tiefe nur über Rahmen: kein Schatten, kein Glas, keine Unschärfe.</text>
    <text x="470" y="882" fill="#B4B8BC">5  Zahlen in Tabellen-Monospace, damit beim Zählen nichts springt.</text>
    <text x="470" y="902" fill="#B4B8BC">6  Beide Modi zeigen denselben Zustand, damit sich Token vergleichen lassen.</text>
    <text x="40" y="922" fill="#62676C">limits: no motion shown, no keyboard, no 200 % font scale, one screen only. Those are covered by T-197 to T-199.</text>
  </g>
