<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="920" height="600"
     role="img" aria-label="The nine own DroidRoute icons on a 24dp grid">
  <title>DroidRoute own icon set</title>
  <desc>Nine icons for concepts that have no standard glyph: signal path, provider, key, quota window, local model, MCP bridge, tunnel, cost, log stream. Grid 24x24, stroke 2, round caps and joins, fill only for lamp dots. Everything else in the app uses Material Symbols.</desc>
  <defs>
    <!-- 24x24 grid, stroke 2, round caps. Path data is copied into Compose as-is. -->
    <g id="i-signal-path">
      <circle cx="12" cy="12" r="7"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <circle cx="17" cy="12" r="2.4" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-provider">
      <rect x="3.5" y="6.5" width="17" height="11" rx="2.5"/>
      <line x1="12" y1="6.5" x2="12" y2="17.5"/>
      <circle cx="16" cy="12" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="8" cy="12" r="1.6" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-key">
      <circle cx="7.5" cy="12" r="3.5"/>
      <line x1="11" y1="12" x2="21" y2="12"/>
      <line x1="16.5" y1="12" x2="16.5" y2="15"/>
      <line x1="20" y1="12" x2="20" y2="15"/>
    </g>
    <g id="i-quota">
      <path d="M4.5 15.5 A8 8 0 1 1 19.5 15.5"/>
      <line x1="12" y1="12" x2="16.5" y2="8.5"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-local-model">
      <rect x="6.5" y="6.5" width="11" height="11" rx="2"/>
      <rect x="10.5" y="10.5" width="3" height="3" rx="0.5"/>
      <line x1="12" y1="3" x2="12" y2="6.5"/>
      <line x1="12" y1="17.5" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="6.5" y2="12"/>
      <line x1="17.5" y1="12" x2="21" y2="12"/>
    </g>
    <g id="i-mcp">
      <path d="M9 4.5 H5.5 V19.5 H9"/>
      <path d="M15 4.5 H18.5 V19.5 H15"/>
      <line x1="7" y1="12" x2="17" y2="12"/>
      <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-tunnel">
      <path d="M3.5 18.5 A8.5 8.5 0 0 1 20.5 18.5"/>
      <line x1="8" y1="18.5" x2="16" y2="18.5"/>
      <line x1="3.5" y1="18.5" x2="3.5" y2="21"/>
      <line x1="20.5" y1="18.5" x2="20.5" y2="21"/>
    </g>
    <g id="i-cost">
      <circle cx="12" cy="12" r="8"/>
      <line x1="12" y1="6.5" x2="12" y2="17.5"/>
      <line x1="9" y1="10" x2="15" y2="10"/>
      <line x1="9" y1="14" x2="15" y2="14"/>
    </g>
    <g id="i-log">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="16" y2="12"/>
      <line x1="4" y1="17" x2="18" y2="17"/>
      <circle cx="21" cy="12" r="1.4" fill="currentColor" stroke="none"/>
    </g>
  </defs>

  <rect width="460" height="300" fill="#0E1217"/>
  <text x="20" y="26" fill="#E5E8EB" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="600">Own icon set — 24dp grid, 2dp stroke, round caps</text>
  <text x="20" y="42" fill="#898E94" font-family="ui-monospace, monospace" font-size="9.5">nine icons for concepts with no standard glyph · everything else is Material Symbols</text>

  <g fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#DE8F57">
    <use href="#i-signal-path" transform="translate(20,60) scale(1.5)"/>
    <use href="#i-provider"    transform="translate(80,60) scale(1.5)"/>
    <use href="#i-key"         transform="translate(140,60) scale(1.5)"/>
    <use href="#i-quota"       transform="translate(200,60) scale(1.5)"/>
    <use href="#i-local-model" transform="translate(260,60) scale(1.5)"/>
    <use href="#i-mcp"         transform="translate(320,60) scale(1.5)"/>
    <use href="#i-tunnel"      transform="translate(380,60) scale(1.5)"/>
  </g>
  <g fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#DE8F57">
    <use href="#i-cost" transform="translate(20,130) scale(1.5)"/>
    <use href="#i-log"  transform="translate(80,130) scale(1.5)"/>
  </g>

  <g fill="#898E94" font-family="ui-monospace, monospace" font-size="8.5" text-anchor="middle">
    <text x="38" y="126">signal path</text>
    <text x="98" y="126">provider</text>
    <text x="158" y="126">key</text>
    <text x="218" y="126">quota</text>
    <text x="278" y="126">local model</text>
    <text x="338" y="126">MCP</text>
    <text x="398" y="126">tunnel</text>
    <text x="38" y="196">cost</text>
    <text x="98" y="196">log stream</text>
  </g>

  <!-- 20dp legibility proof -->
  <line x1="20" y1="215" x2="440" y2="215" stroke="#22272C"/>
  <text x="20" y="234" fill="#B4B8BC" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="600">Legibility at the size they are actually used</text>
  <g fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#DE8F57">
    <g transform="translate(20,246) scale(0.833)">
      <use href="#i-signal-path"/><use href="#i-key" transform="translate(24,0)"/><use href="#i-quota" transform="translate(48,0)"/><use href="#i-mcp" transform="translate(72,0)"/><use href="#i-cost" transform="translate(96,0)"/>
    </g>
    <g transform="translate(140,252) scale(0.667)">
      <use href="#i-signal-path"/><use href="#i-provider" transform="translate(24,0)"/><use href="#i-key" transform="translate(48,0)"/><use href="#i-local-model" transform="translate(72,0)"/><use href="#i-log" transform="translate(96,0)"/>
    </g>
  </g>
  <g fill="#898E94" font-family="ui-monospace, monospace" font-size="8.5">
    <text x="20" y="292">20 dp</text>
    <text x="140" y="292">16 dp — below this they are replaced by a label</text>
  </g>
</svg>
